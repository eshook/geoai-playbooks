name: Build and Deploy GeoAI Playbooks

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
    branches:
      - main

# Allow only one concurrent deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.39"

      - name: Build Decision Maker Playbook
        run: |
          cd books/decision-makers
          quarto render

      - name: Build Developer Playbook
        run: |
          cd books/developers
          quarto render

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r _book/decision-makers _site/decision-makers
          cp -r _book/developers _site/developers

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
